popup:
    homeOwnershipTitle: Why this question?
    homeOwnershipContent: >-
        Housing occupancy status (renter or homeowner) is associated with different
        mobility behaviors. This information allows us to better interpret the survey
        results and ensures that the collected data is representative of all households
        in the region.
    householdSizeTitle: Who should be included in this number?
    householdSizeContent: >-
        <span class="_green">Include :</span><br />- Yourself<br />- Children in shared
        custody if they were present at your home on <span class="_green">{{assignedDate}}</span><br
        />- Roommates and housemates, as well as all people living in a shared household
        community
    householdCarNumberTitle: Which vehicles should be included?
    householdCarNumberContent: >-
        <span class="_green">Include:</span><br />- Cars, SUVs, light trucks, trucks,
        and vans<br />- Vehicles provided or leased by an employer that members of
        your household use for commuting or personal reasons<br /><span class="_red">Do
        not include:</span><br />- Mopeds, scooters, and motorcycles (gas or electric)<br
        />- Car-sharing vehicles<br />- A vehicle parked at the workplace and used
        exclusively for work<br />- Stored vehicles that are driven only rarely
    householdTwoWheelTitle: Which vehicles should be included?
    householdTwoWheelContent: >-
        <span class="_green">Include:</span><br />- Mopeds and motorcycles (gas or
        electric)<br /><span class="_red">Do not include:</span><br />- Cars, SUVs,
        light trucks, trucks, and vans<br />- Bicycles or electric bicycles<br />-
        Kick scooters or electric scooters
    accessCodeHelpPopupTitle: Where find my access code?
    accessCodeHelpPopupContent: >-
        capture de la lettre<br />If you have not received the invitation letter,
        you are not eligible for the enquête métropolitaine 2026 Perspectives mobilité.
    disabilityHelpPopupTitle: Why this question?
    disabilityHelpPopupContent: >-
        We ask whether any household members have disabilities that limit their mobility
        in order to better understand how these limitations affect their travel behavior.
        This information will help us propose transportation services that are better
        tailored to their needs.
