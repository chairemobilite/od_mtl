completedTextOutOfTerritory: >-
    <strong>Merci de votre intérêt pour l’enquête Perspectives mobilité.</strong><br
    /><br />Cette enquête s’adresse uniquement aux personnes résidant sur le territoire
    étudié.<br /><br />Si vous n’y habitez pas actuellement, vos réponses ne pourront
    malheureusement pas être utilisées.<br /><br />Nous vous remercions pour votre
    compréhension.
completedText: >-
    <strong>Merci pour votre participation!</strong><br /><br /><span class="_pale
    _oblique">Vous pouvez modifier vos réponses en cliquant sur les sections dans
    le menu ci-dessus.</span><br />Nous vous remercions d'avoir pris le temps de remplir
    ce questionnaire. <strong>Vos réponses ont été enregistrées avec succès.</strong>
    Si vous avez fourni un courriel et coché la boite indiquant votre intérêt à participer
    au concours, vous êtes admissible au tirage de prix de participation.<br /><br
    />Les données que vous nous avez fournies contribueront aux efforts de planification
    de l'ARTM et de ses partenaires ainsi qu’à favoriser une meilleure compréhension
    des enjeux d'accès et de mobilité dans la grande région de Montréal.<br /><br
    />Vous habitez sur le <a href="https://www.artm.quebec/wp-content/uploads/2018/05/Carte_ARTM.jpg"
    target="_blank">territoire de l'ARTM</a>? Contribuez à améliorer la mobilité en
    partageant votre opinion via nos sondages. Courez la chance de gagner <strong>500$
    chaque mois</strong> et un grand prix de <strong>1 000$ par année</strong>. <strong>Inscrivez-vous
    dès maintenant au panel <span class="_pale _oblique">Parlons mobilité</span> de
    l'ARTM</strong> en cliquant sur le bouton ci-dessous.
buttonARTMPanel: S'inscrire au panel « Parlons mobilité »
