homepage:
    AgreementText: Je consens
    ErrorNotAgreed: >-
        Vous devez accepter les conditions d'utilisation pour débuter le
        questionnaire.
    introduction: >-
        <p class="left"><span class="_sarcelle _strong">Contribuez à la planification de la
        mobilité et courez la chance de gagner l'un des nombreux prix offerts (montant total de
        2 500 $)!</span></p><br/><p class="left"><span class="_strong">Le Bureau des enquêtes sur
        la mobilité</span>, piloté par l'Autorité régionale de transport métropolitain (ARTM), invite
        la population de la région métropolitaine de Montréal à faire connaître leurs habitudes de
        déplacement.</p><br/><p class="left _strong">La date limite pour participer est le 16
        décembre 2026.</p><br/><p class="left _oblique" style="font-size: 80%; margin-bottom:
        1rem">En cochant la boîte dessous, vous consentez à la collecte, au traitement et aux
        utilisations possibles des données décrites dans <a
        href="https://www.artm.quebec/wp-content/uploads/2026/07/Enonce-confidentialite_Enquetes-Pm-FR_R01_2026.pdf"
        target="_blank">l'énoncé de confidentialité</a>. Cet énoncé explique, entre autres, que des
        données pourraient être partagées pour des fins de recherche et de planification. De plus, en
        cochant la boîte ci-dessous, vous attestez être autorisé à fournir les renseignements
        personnels des personnes mineures habitant votre ménage, soit en tant qu'autorité parentale ou
        tuteur/tutrice.</p>
    introductionParagraphTwo: ''
    start: Débuter
footer: >-
    <div style="display: flex;justify-content: center;">
        <div style="font-size:
        80%;max-width: 700px;margin: 15px;">
            <p><a href="https://www.artm.quebec/wp-content/uploads/2026/07/Enonce-confidentialite_Enquetes-Pm-FR_R01_2026.pdf"
                    target="_blank">Énoncé de confidentialité</a>&nbsp;|&nbsp;<a
                    href="https://www.artm.quebec/wp-content/uploads/2026/07/Reglement-concours_Enquete-2026-Pm_FR.pdf"
                    target="_blank">Règlement du concours</a>&nbsp;|&nbsp;<a
                    href="https://www.artm.quebec/planification/enquete-metropolitaine-perspectives-mobilite/"
                    target="_blank">Plus d'infos</a>&nbsp;|&nbsp;<a
                    href="mailto:perspectivesmobilite@artm.quebec?subject=Enquête%20Perspectives%20Mobilité"
                    target="_blank">Nous joindre</a></p>
        </div>
    </div>
    <details class="faq-container">
        <summary class="faq-title ornament_bottom">Foire aux questions
            (FAQ)</summary>
        <details>
            <summary class="_h2">Qu'est-ce que l'enquête métropolitaine Perspectives mobilité?</summary>
            <p>L'Autorité régionale de transport métropolitain (ARTM), en collaboration avec le ministère des
                Transports et de la Mobilité durable (MTMD), mène l'enquête métropolitaine Perspectives mobilité, du 1
                septembre au 16 décembre 2026, auprès d'un échantillon de ménages de la grande région de Montréal.</p>
            <p>Cette enquête vise à mieux comprendre comment les résidents de la région métropolitaine de Montréal se
                déplacent, peu importe la fréquence de leurs déplacements ou les modes de transport qu'ils utilisent,
                que ce soit l'auto, le transport collectif, la marche, le vélo ou d'autres formes de mobilité.</p>
        </details>
        <details>
            <summary class="_h2">Pourquoi l'ARTM mène-t-elle l'enquête métropolitaine Perspectives mobilité?</summary>
            <p>Les données recueillies et analysées dans le cadre de l'enquête fournissent une information fiable sur
                les déplacements des personnes dans la région métropolitaine de Montréal.</p>
            <p>Ces données sont essentielles pour permettre aux autorités publiques, comme le MTMD, les administrations
                municipales, l'ARTM et les opérateurs de transport en commun, de planifier et d'améliorer les réseaux
                routiers ainsi que de transport collectif, en plus de soutenir l'aménagement du territoire.</p>
            <p>L'édition 2026 de l'enquête revêt une importance particulière. D'une part, elle permettra de voir comment
                certaines tendances observées depuis 2023, comme le télétravail, ont évolué. D'autre part, 2026 marque
                la première année d'un changement des méthodes d'enquête dans la région : les partenaires font évoluer
                la collecte de données afin de rendre plus flexible, réactive et rapide la mécanique de collecte, de
                traitement et de dissémination des données issues des enquêtes métropolitaines, en passant d'un modèle
                de collecte tous les cinq ans à une collecte chaque automne.</p>
        </details>
        <details>
            <summary class="_h2">À quelle fréquence l'enquête est-elle réalisée?</summary>
            <p>L'enquête métropolitaine a été réalisée essentiellement tous les cinq ans, de 1970 à 2023.</p>
            <p>À partir de 2026, elle sera menée chaque automne. Cette approche permettra de suivre plus finement
                l'évolution de la mobilité dans la grande région de Montréal, de réduire les effets d'imprévus pouvant
                perturber une collecte, comme une grève postale, une interruption de service importante ou une pandémie,
                et d'améliorer en continu les méthodes de collecte et de traitement afin de produire les données les
                plus fiables possibles.</p>
        </details>
        <details>
            <summary class="_h2">À qui s'adresse l'enquête métropolitaine Perspectives mobilité?</summary>
            <p>Au total, ce sont près de deux cent soixante-cinq mille (265 000) ménages qui seront invités en 2026 par
                la poste à répondre au questionnaire. Ces ménages pourront répondre en ligne ou par téléphone, au
                besoin, avec l'aide d'un agent du centre d'appels.</p>
            <p>La population visée par l'enquête correspond à l'ensemble des personnes âgées de cinq ans et plus, habitant
                un logement privé dans une des municipalités de la grande région de Montréal.</p>
            <p>Seules les personnes sollicitées par la poste peuvent participer à l'enquête. Cette méthodologie vise à
                s'assurer de recueillir des données en provenance d'un échantillon représentatif de la population et
                d'éviter d'éventuels biais.</p>
            <p>L'ARTM rappelle aux personnes qui recevront une lettre par la poste qu'il est important de participer,
                peu importe les moyens de transport qu'ils utilisent (véhicule privé, transport collectif, transport
                actif…) ou le fait qu'ils se déplacent peu.</p>
            <p>Surveillez votre boîte postale entre le 1 septembre et le 16 décembre.</p>
        </details>
        <details>
            <summary class="_h2">Comment peut-on participer à l'enquête métropolitaine Perspectives mobilité?</summary>
            <p>Si vous avez reçu une invitation par la poste, vous rendre à l'adresse Web indiquée dans la lettre. Nous
                vous recommandons de répondre à l'enquête sur un ordinateur ou tablette électronique pour une meilleure
                expérience, mais vous pouvez également balayer le code QR avec un téléphone intelligent. Utilisez
                ensuite le code d'accès unique qui vous a été fourni pour accéder au questionnaire en ligne.</p>
            <p>Si vous éprouvez de la difficulté à répondre au questionnaire, vous pouvez communiquer avec le centre
                d'appels au 438-476-5920. Un agent pourra vous aider à remplir le questionnaire par téléphone du mercredi
                au vendredi, entre 10 h et 16 h et le samedi, de 10 h à 14 h.</p>
        </details>
        <details>
            <summary class="_h2">Pourquoi est-il important pour les personnes ayant reçu une invitation par la poste de
                participer à l'enquête métropolitaine?</summary>
            <p>Les enquêtes sur la mobilité sont essentielles, car elles fournissent aux autorités publiques, comme le
                gouvernement du Québec, les municipalités, l'ARTM et les sociétés de transport collectif, des données
                concrètes pour contribuer à l'amélioration du réseau routier, réduire les impacts de la congestion,
                planifier et améliorer les services de transport collectif et appuyer les efforts de réduction des
                émissions de gaz à effet de serre. Elles servent aussi à orienter l'aménagement du territoire et la
                création de milieux de vie attrayants, par exemple comme intrants à la révision des schémas
                d'aménagement et à la planification des quartiers, des pôles d'activité et des accès aux services.</p>
            <p>Ces données alimentent aussi la recherche pour mieux comprendre les enjeux d'accessibilité et d'équité
                dans les déplacements. Elles peuvent, par exemple, aider à étudier la répartition de l'espace public
                selon les usages des voies publiques, à mieux comprendre les besoins de déplacement entre les secteurs
                et à orienter des décisions qui rendent les déplacements plus efficaces, plus sécuritaires et plus
                équitables. En bout de ligne, une meilleure connaissance de la mobilité contribue à un meilleur accès aux
                services et aux opportunités, ainsi qu'à une meilleure qualité de vie pour l'ensemble de la population.</p>
        </details>
        <details>
            <summary class="_h2">Quels sont les prix à gagner en participant à l'enquête?</summary>
            <p>En remplissant le questionnaire de l'enquête en ligne ou par téléphone, avant le 16 décembre 2026, les
                participants peuvent être éligibles au tirage de tablettes électroniques Apple ou Android (valeur
                d'environ 500 $), de montres intelligentes (valeur d'environ 200 $) et de prix en argent (prix de 500 $
                ou 200 $). Au total, <strong>2 500 $ en prix seront tirés en 2026</strong>.</p>
            <p>Les personnes gagnantes seront désignées au hasard, le 17 décembre 2026, et contactées par courriel dans
                les quinze (15) jours suivant le tirage.</p>
            <p>Pour consulter le règlement du concours, visitez le <a
                    href="https://www.artm.quebec/wp-content/uploads/2026/07/Reglement-concours_Enquete-2026-Pm_FR.pdf"
                    target="_blank">site Web de l'ARTM</a>.</p>
        </details>
        <details>
            <summary class="_h2">Combien de temps est requis pour répondre à l'enquête?</summary>
            <p>Le temps moyen estimé pour remplir le questionnaire se situe entre 10 et 20 minutes. Il peut toutefois
                varier selon la taille de votre ménage et le nombre de déplacements à rapporter.</p>
        </details>
        <details>
            <summary class="_h2">Comment s'assure-t-on que les renseignements demeurent confidentiels?</summary>
            <p>Le respect de la vie privée des personnes qui participent à l'enquête est une priorité pour l'ARTM et ses
                partenaires. C'est pourquoi nous mettons en place les mesures de sécurité nécessaires pour assurer la
                protection des renseignements recueillis et échangés avec les participants dans le cadre du programme
                d'enquêtes Perspectives mobilité.</p>
            <p>Les coordonnées fournies par les personnes qui acceptent d'être recontactées à des fins de recherche sont
                conservées séparément des réponses au questionnaire. Si une personne y consent, un lien temporaire et
                sécurisé peut être conservé pendant une période limitée afin de permettre des relances ciblées selon
                certains profils de mobilité ou caractéristiques du ménage. Les analyses courantes demeurent réalisées à
                partir de données dépersonnalisées.</p>
            <p>Pour consulter l'Énoncé de confidentialité, visitez le <a
                    href="https://www.artm.quebec/wp-content/uploads/2026/07/Enonce-confidentialite_Enquetes-Pm-FR_R01_2026.pdf"
                    target="_blank">site Web de l'ARTM</a>.</p>
        </details>
        <details>
            <summary class="_h2">Est-ce la même enquête que l'enquête Origine-Destination?</summary>
            <p>Oui. Auparavant appelée enquête Origine-Destination, elle porte depuis 2023 le nom d'« enquête
                métropolitaine Perspectives mobilité ». Ce nouveau nom reflète le rôle essentiel qu'elle joue pour une
                variété d'intervenants dans la planification des projets d'infrastructure ainsi que pour la recherche,
                notamment dans le domaine des transports. Les enquêtes menées dans d'autres régions du Québec par le
                Ministère des Transports et de la Mobilité durable (MTMD) s'appellent toujours « Enquêtes
                Origine-Destination ».</p>
        </details>
        <details>
            <summary class="_h2">À quel moment les résultats de l'enquête métropolitaine Perspectives mobilité 2026
                seront-ils connus?</summary>
            <p>Le temps requis pour traiter et analyser les données est évalué entre 12 et 18 mois. Les résultats
                préliminaires devraient donc être connus d'ici la fin 2027.</p>
            <p>La collecte de données d'enquête métropolitaine étant réalisée à chaque automne à partir de 2026, à plus
                petit échantillon, les livrables typiques ne seront pas livrés avant 2029. Les données de la première
                année serviront surtout à des analyses globales ou de tendances à haut niveau. Au fil des prochaines
                années, l'ajout de nouvelles données permettra de bonifier la base de données et d'obtenir des analyses
                plus détaillées à des niveaux géographiques plus fins.</p>
        </details>
        <details>
            <summary class="_h2">Je n'arrive pas à accéder au questionnaire (problème avec le lien, le code QR, le
                chargement de la page), ou je ne peux pas passer à la page suivante. Que dois-je faire?</summary>
            <p>Veuillez d'abord patienter quelques instants pour permettre le chargement du questionnaire. Cela peut
                prendre jusqu'à une minute en fonction de la vitesse de chargement de votre connexion internet, mais
                sachez que le questionnaire est relativement « léger », car il ne contient qu'une ou deux images et
                aucune vidéo.</p>
            <p>Vous pouvez rafraîchir la page de votre navigateur ou fermer la fenêtre, puis retourner au site de
                l'enquête. Dans la plupart des cas, cela vous ramènera à la page où vous étiez et elle devrait se
                charger correctement. Notez que si vos paramètres de navigateur web ne permettent pas de stocker les
                témoins de connexion (cookies), il est possible que vous ayez à vous reconnecter pour retrouver votre
                progression.</p>
            <p>Vous pouvez aussi tenter de répondre au sondage avec un autre navigateur web (Chrome, Safari, Firefox,
                Edge, etc.).</p>
            <p>Enfin, si vous ne pouvez pas vous rendre à la page suivante, vérifiez que vous avez entré une réponse à
                toutes les questions obligatoires et que le format est correct (par exemple, une question sur l'âge
                nécessite une réponse en chiffres, un positionnement de lieu demande une certaine précision sur la
                carte, etc.). Une question invalide ou incomplète sera signalée par un encadré rouge.</p>
            <p>Si malgré tout vous ne parvenez pas à accéder au questionnaire, vous pouvez contacter le 438-476-5920
                en fournissant votre code unique ainsi que le courriel associé à votre soumission, l'adresse postale
                associée à votre code, ainsi que toute autre information complémentaire qui permettra à l'agent de
                valider votre identité.</p>
        </details>
        <details>
            <summary class="_h2">Est-ce que mes réponses seront sauvegardées si je quitte le questionnaire et que j'y
                reviens plus tard pour le compléter?</summary>
            <p>Quelle que soit la situation, vos réponses sont enregistrées au fur et à mesure. Ainsi, elles nous seront
                transmises si vous quittez le questionnaire, que vous y reveniez plus tard ou non.</p>
            <p>Si vous aviez fourni une adresse courriel avant de commencer l'enquête (sur la page de connexion), vous
                pouvez entrer à nouveau cette adresse, et un lien de connexion unique vous sera envoyé pour retrouver
                vos réponses. Si vous avez utilisé une authentification par compte Google, vous pouvez vous reconnecter
                et retrouver vos réponses de cette manière.</p>
            <p>Enfin, si vous n'êtes pas dans l'un des cas ci-dessus, vous pouvez contacter le 438-476-5920 en
                fournissant votre code unique ainsi que le courriel utilisé ou l'adresse postale associée à votre réponse
                ainsi que toute autre information complémentaire qui permettra à l'agent de valider votre identité. Un
                agent ou une agente sera alors à même de retrouver votre enquête et de la poursuivre avec vous.</p>
        </details>
        <details>
            <summary class="_h2">Avez-vous reçu mes réponses au sondage?</summary>
            <p>Nous avons presque certainement reçu vos réponses, car elles nous parviennent automatiquement lorsque
                vous remplissez le questionnaire, et ce, au fur et à mesure, même si vous ne vous êtes pas rendu à la
                fin.</p>
            <p>Notez qu'aucune confirmation ne vous sera transmise par courriel une fois que vous aurez soumis le
                questionnaire complété; la page de fin (et de remerciements) du questionnaire indique que votre réponse
                est enregistrée comme complète.</p>
        </details>
        <details>
            <summary class="_h2">Comment puis-je annuler ma participation à l'enquête?</summary>
            <p>Vous pouvez nous contacter à <a href="mailto:perspectivesmobilite@artm.quebec">perspectivesmobilite@artm.quebec</a>
                avec votre code unique et l'adresse postale associée, et nous nous assurerons de supprimer toutes les
                réponses liées à votre code. Notez que si vous avez entré un code erroné, nous ne pourrons pas supprimer
                votre enquête.</p>
        </details>
        <details>
            <summary class="_h2">Question ou commentaire à propos de l'ARTM</summary>
            <p>Pour toute question ou commentaire à propos de l'ARTM, contactez-nous via le formulaire en ligne: <a
                    href="https://www.artm.quebec/application-mobile-chrono/contactez-nous/" target="_blank">ARTM – Vous
                    souhaitez communiquer avec l'ARTM</a>.</p>
        </details>
    </details>

