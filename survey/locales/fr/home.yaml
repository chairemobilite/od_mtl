popup:
    homeOwnershipTitle: Pourquoi cette question?
    homeOwnershipContent: >-
        Le statut d’occupation du logement (locataire ou propriétaire) est associé
        à des comportements de mobilité différents. Cette information nous permet
        de mieux interpréter les résultats de l’enquête et de nous assurer que les
        données recueillies sont représentatives de l’ensemble des ménages de la région.
    householdSizeTitle: Qui inclure dans ce nombre?
    householdSizeContent: >-
        <span class="_green">Inclure :</span><br />- Vous-même<br />- Les enfants
        en garde partagée s'ils étaient présents à votre domicile le <span class="_green">{{assignedDate}}</span><br
        />- Les chambreuses, les chambreurs et colocataires, ainsi que tous ceux et
        celles qui vivent en communauté domestique
    householdCarNumberTitle: Quels véhicules inclure?
    householdCarNumberContent: >-
        <span class="_green">Inclure :</span> <br />- Les automobiles, VUS, camions
        légers, camions et fourgonnettes<br />- Les véhicules fournis ou loués par
        un employeur que les membres de votre ménage utilisent pour aller au travail
        ou pour des raisons personnelles<br /><span class="_red">Ne pas inclure :</span>
        <br />- Les mobylettes, scooters et motos (à essence ou électriques)<br />-
        Les véhicules d’autopartage<br />- Un véhicule stationné au lieu de travail
        utilisé exclusivement pour le travail<br />- Les véhicules remisés ou de collection
        utilisés rarement
    householdTwoWheelTitle: Quels véhicules inclure?
    householdTwoWheelContent: >-
        <span class="_green">Inclure :</span> <br />- Les mobylettes, scooters et
        motos (à essence ou électriques)<br /><span class="_red">Ne pas inclure :</span>
        <br />- Les automobiles, VUS, camions légers, camions et fourgonnettes<br
        />- Les vélos ou vélos électriques<br />- Les trottinettes ou trottinettes
        électriques
    accessCodeHelpPopupTitle: Où trouver mon code d’accès?
    accessCodeHelpPopupContent: >-
        capture de la lettre<br />Si vous n'avez pas reçu de lettre d'invitation,
        vous n'êtes pas éligible à l'enquête métropolitaine 2026 Perspectives mobilité.
    disabilityHelpPopupTitle: Pourquoi cette question?
    disabilityHelpPopupContent: >-
        Nous demandons si des personnes présentent des incapacités qui limitent leur
        mobilité afin d'étudier les impacts sur leur façon de se déplacer. À postériori,
        ces informations permettront de proposer une offre de transport plus adaptée
        à leurs besoins.
