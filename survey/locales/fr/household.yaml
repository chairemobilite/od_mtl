popup:
    studentTitle: Qui considérer comme étudiant?
    studentContent: >-
        <span class="_green">Inclure :</span><br />- Tous les étudiants et élèves
        à partir de 15 ans, indépendamment du niveau d'enseignement.<br />- Toute
        personne suivant des cours de façon régulière via un établissement.<br />-
        Toute personne actuellement en stage / alternance / apprentissage, mais inscrite
        dans un établissement d'enseignement.<br /><span class="_red">Ne pas inclure
        :</span><br />- Les formations ponctuelles ou en ligne.<br />- Les cours particuliers,
        etc.
    workerTitle: Qui considérer comme travailleur?
    workerContent: >-
        <span class="_green">Inclure :</span> <br />- Toute personne avec un emploi
        ou une entreprise, même si temporairement absente au moment de répondre (ex.
        : congé de maladie, congé parental, vacances, mise à pied temporaire). <br
        />- Tout travailleur salarié ou à son compte.<br /><span class="_red">Ne pas
        inclure :</span> <br />- Les personnes sans emploi et ne cherchant pas de
        travail.
    validateHouseholdAgesHelp: >-
        Au moins un membre de votre ménage doit avoir 16 ans ou plus pour répondre
        à ce questionnaire. Veuillez vérifier les âges.
    validateHouseholdAgesHelp_one: Vous devez avoir au moins 16 ans pour répondre
        à ce questionnaire.
    transitFareTitle: Zones tarifaires?
