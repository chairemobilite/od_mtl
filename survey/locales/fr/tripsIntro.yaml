WhyThisDateExplanation: >-
    Certaines personnes se déplaceront plus ou moins que d’habitude, voire n’effectueront
    aucun déplacement la journée assignée. D’autres utiliseront des modes différents
    qu’à l’habitude, selon la météo, les courses à faire ou d’autres responsabilités.<br
    /><strong>Merci d’indiquer vos déplacements réels pour la journée demandée</strong>
    : c’est cette diversité de comportements qui nous aide à mieux comprendre la mobilité.
